<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel: Island Run — a flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1a26; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #error { position: fixed; left: 8px; bottom: 8px; z-index: 30; color: #ffb4ac; font: 13px monospace; white-space: pre-wrap; }
  /* HUD: glass panels, lit instruments. */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; color: #eaf2f6; display: none; }
  .panel { background: rgba(10, 26, 38, 0.62); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 10px; backdrop-filter: blur(2px); }
  #hud-left { position: absolute; top: 14px; left: 14px; padding: 10px 14px; display: flex; gap: 18px; }
  .gauge { text-align: center; min-width: 74px; }
  .gauge .value { font-size: 26px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .gauge .unit { font-size: 11px; color: #9fc3d4; letter-spacing: 0.08em; }
  .gauge .label { font-size: 10px; color: #9fc3d4; letter-spacing: 0.14em; margin-top: 2px; }
  #hud-top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 8px 18px; text-align: center; }
  #hud-objective { font-size: 15px; font-weight: 600; }
  #hud-target { font-size: 12px; color: #9fc3d4; margin-top: 2px; }
  #hud-arrow { display: inline-block; font-size: 16px; color: #ffc53d; margin-right: 6px; }
  #hud-right { position: absolute; top: 14px; right: 14px; padding: 10px 14px; text-align: right; }
  #hud-score { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #hud-right .label { font-size: 10px; color: #9fc3d4; letter-spacing: 0.14em; }
  #hud-rings, #hud-time { font-size: 13px; font-variant-numeric: tabular-nums; }
  #hud-bottom { position: absolute; left: 14px; bottom: 14px; padding: 10px 14px; width: 210px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 11px; letter-spacing: 0.1em; color: #9fc3d4; }
  .bar { flex: 1; height: 10px; background: rgba(255,255,255,0.14); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: #3ecf6e; border-radius: 5px; }
  .bar-fill.low { background: #ff6b5e; }
  #hud-throttle-bar { background: #ffc53d; }
  .bar-val { min-width: 38px; text-align: right; color: #eaf2f6; font-variant-numeric: tabular-nums; }
  #hud-warn { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); background: rgba(120, 20, 12, 0.78); border: 1px solid #ff6b5e; color: #fff; font-weight: 700; letter-spacing: 0.08em; padding: 8px 18px; border-radius: 8px; display: none; font-size: 15px; }
  #hud-help { position: absolute; right: 14px; bottom: 14px; padding: 8px 12px; font-size: 11px; color: #9fc3d4; line-height: 1.6; text-align: right; }
  #hud.cockpit #hud-bottom, #hud.cockpit #hud-help { display: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="Kestrel Island Run: fly the prop plane through the rings and land on runway 09"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="error" aria-hidden="true"></div>
<div id="hud">
  <div id="hud-left" class="panel">
    <div class="gauge"><div class="value" id="hud-alt">0</div><div class="unit">FEET</div><div class="label">ALTITUDE</div></div>
    <div class="gauge"><div class="value" id="hud-speed">0</div><div class="unit">KNOTS</div><div class="label">AIRSPEED</div></div>
    <div class="gauge"><div class="value" id="hud-heading">000</div><div class="unit">DEG</div><div class="label">HEADING</div></div>
    <div class="gauge"><div class="value" id="hud-vspeed">+0</div><div class="unit">FT/MIN</div><div class="label">CLIMB</div></div>
  </div>
  <div id="hud-top" class="panel">
    <div id="hud-objective">Fly through the rings, then land on runway 09.</div>
    <div id="hud-target"><span id="hud-arrow">&#10148;</span><span id="hud-target-text">Ring 1 · 0 m</span></div>
  </div>
  <div id="hud-right" class="panel">
    <div class="label">SCORE</div>
    <div id="hud-score">0</div>
    <div><span class="label">RINGS&nbsp;</span><span id="hud-rings">0/8</span>&nbsp;&nbsp;<span class="label">TIME&nbsp;</span><span id="hud-time">0:00</span></div>
  </div>
  <div id="hud-bottom" class="panel">
    <div class="bar-row"><span>FUEL</span><div class="bar"><div class="bar-fill" id="hud-fuel-bar" style="width:100%"></div></div><span class="bar-val" id="hud-fuel">100%</span></div>
    <div class="bar-row"><span>THR</span><div class="bar"><div class="bar-fill" id="hud-throttle-bar" style="width:70%"></div></div><span class="bar-val" id="hud-throttle">70%</span></div>
  </div>
  <div id="hud-help" class="panel">Arrows / WASD fly &middot; Shift / Ctrl throttle<br>Mouse steers &middot; C cockpit &middot; F flaps &middot; P pause</div>
  <div id="hud-warn"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
